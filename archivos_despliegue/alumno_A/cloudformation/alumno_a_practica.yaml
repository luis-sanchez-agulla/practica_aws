AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Practica UFV - eu-south-2 (Spain): Windows AD sobre VPC existente
  Windows Server 2025, t3.micro, IP privada fija 10.10.1.10

Parameters:

  KeyName:
    Description: Nombre del par de claves existente para EC2
    Type: AWS::EC2::KeyPair::KeyName

  MyIP:
    Description: Tu IP publica para acceso RDP (ejemplo 203.0.113.25/32)
    Type: String

  VpcId:
    Description: ID de tu VPC existente (proyecto-vpc 10.10.0.0/16)
    Type: AWS::EC2::VPC::Id
    Default: vpc-0c5d48a4d174c5c9b

  SubnetPublicaId:
    Description: ID de la subnet publica existente (10.10.1.0/24)
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0b4ae4cb4242c2acb

  S3BucketName:
    Description: Nombre del bucket S3 con los scripts PowerShell
    Type: String
    Default: buclet-practica-ufv-config

Resources:

  # -------------------------------------------------------
  # ROL IAM PARA EC2
  # Permite a la instancia acceder a S3 sin credenciales hardcodeadas
  # -------------------------------------------------------
  RolEC2S3Spain:
    Type: AWS::IAM::Role
    Properties:
      RoleName: rol-ec2-s3-ufv-spain
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

  InstanceProfileEC2Spain:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: perfil-ec2-s3-ufv-spain
      Roles:
        - !Ref RolEC2S3Spain

  # -------------------------------------------------------
  # SECURITY GROUP PROPIO
  # Explicación: Creamos el SG dentro del stack usando el VpcId como parametro.
  # Asi CloudFormation lo asocia correctamente a la VPC y no al default.
  # -------------------------------------------------------
  SGWindowsAD:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: SG-Windows-AD-UFV
      GroupDescription: Security Group Windows AD Practica UFV
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # RDP solo desde tu IP
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          CidrIp: !Ref MyIP
          Description: RDP desde IP del administrador
        # Todo el trafico interno de la VPC (necesario para AD, DNS, DHCP, Kerberos)
        - IpProtocol: -1
          CidrIp: 10.10.0.0/16
          Description: Trafico interno VPC
        # Trafico desde VPCs del equipo via peering (10.20-50.0.0/16)
        - IpProtocol: -1
          CidrIp: 10.0.0.0/8
          Description: Trafico desde VPCs del equipo via peering
        # HTTPS para descargar AWS CLI y scripts desde S3
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS saliente para S3 y actualizaciones
      Tags:
        - Key: Name
          Value: SG-Windows-AD-UFV

  # -------------------------------------------------------
  # ELASTIC IP
  # IP publica fija que no cambia aunque la instancia se reinicie
  # -------------------------------------------------------
  ElasticIPWindowsSpain:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  # -------------------------------------------------------
  # EC2 WINDOWS SERVER 2025 - Controlador de Dominio
  # -------------------------------------------------------
  EC2WindowsSpain:
    Type: AWS::EC2::Instance
    DependsOn: SGWindowsAD
    Properties:
      ImageId: ami-07bda9eb187fd0680
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      SubnetId: !Ref SubnetPublicaId
      PrivateIpAddress: 10.10.1.10
      IamInstanceProfile: !Ref InstanceProfileEC2Spain
      SecurityGroupIds:
        - !Ref SGWindowsAD
      Tags:
        - Key: Name
          Value: EC2-Windows-AD-Spain
      UserData:
        Fn::Base64: !Sub |
          <powershell>
          # Evitar ejecucion multiple
          if (Test-Path "C:\AD_USERDATA_EJECUTADO.txt") { exit }
          "done" | Out-File "C:\AD_USERDATA_EJECUTADO.txt"

          Start-Sleep -Seconds 30
          Set-ExecutionPolicy Bypass -Scope LocalMachine -Force

          # Instalar AWS CLI
          $awsCliUrl = "https://awscli.amazonaws.com/AWSCLIV2.msi"
          $awsCliInstaller = "C:\AWSCLIV2.msi"
          Invoke-WebRequest -Uri $awsCliUrl -OutFile $awsCliInstaller
          Start-Process msiexec.exe -ArgumentList "/i $awsCliInstaller /quiet" -Wait
          $env:PATH = $env:PATH + ";C:\Program Files\Amazon\AWSCLIV2"

          # Descargar scripts desde S3
          & "C:\Program Files\Amazon\AWSCLIV2\aws.exe" s3 cp s3://${S3BucketName}/alumno-a/scripts/DC01_Parte1_InstalarAD.ps1 C:\DC01_Parte1_InstalarAD.ps1 --region eu-west-1
          & "C:\Program Files\Amazon\AWSCLIV2\aws.exe" s3 cp s3://${S3BucketName}/alumno-a/scripts/DC01_Parte2_Configurar.ps1 C:\DC01_Parte2_Configurar.ps1 --region eu-west-1

          # Ejecutar Parte 1
          & PowerShell.exe -ExecutionPolicy Bypass -File C:\DC01_Parte1_InstalarAD.ps1
          </powershell>

  EIPAssociationWindowsSpain:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref EC2WindowsSpain
      EIP: !Ref ElasticIPWindowsSpain

Outputs:

  ElasticIPAD:
    Description: IP publica del Windows AD
    Value: !Ref ElasticIPWindowsSpain

  PrivateIPAD:
    Description: IP privada del Windows AD
    Value: 10.10.1.10

  SecurityGroupId:
    Description: ID del Security Group creado
    Value: !Ref SGWindowsAD