# Based on https://www.nginx.com/resources/wiki/start/topics/examples/full/#nginx-conf
user              daemon daemon;

worker_processes  auto;
error_log         "/opt/bitnami/nginx/logs/error.log";
pid               "/opt/bitnami/nginx/tmp/nginx.pid";

include  "/opt/bitnami/nginx/conf/context.d/main/*.conf";

events {
    worker_connections  1024;
    include  "/opt/bitnami/nginx/conf/context.d/events/*.conf";
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format    main '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for"';

    access_log    "/opt/bitnami/nginx/logs/access.log" main;
    add_header    X-Frame-Options SAMEORIGIN;

    client_body_temp_path  "/opt/bitnami/nginx/tmp/client_body" 1 2;
    proxy_temp_path        "/opt/bitnami/nginx/tmp/proxy" 1 2;
    fastcgi_temp_path      "/opt/bitnami/nginx/tmp/fastcgi" 1 2;
    scgi_temp_path         "/opt/bitnami/nginx/tmp/scgi" 1 2;
    uwsgi_temp_path        "/opt/bitnami/nginx/tmp/uwsgi" 1 2;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        off;
    gzip               on;
    gzip_http_version  1.0;
    gzip_comp_level    2;
    gzip_proxied       any;
    gzip_types         text/plain text/css application/javascript text/xml application/xml+rss;
    keepalive_timeout  65;
    ssl_protocols      TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    client_max_body_size 80M;
    server_tokens off;

    absolute_redirect  on;
    port_in_redirect   on;

    include  "/opt/bitnami/nginx/conf/context.d/http/*.conf";

    upstream backend_alumno_c {
        server 10.30.0.113:80;
        server 10.30.8.103:80;
    }

    upstream backend_alumno_d {
        server 10.40.1.80:80;
        server 10.40.2.70:80;
    }

    upstream backend_alumno_e {
        server 10.50.1.212:3000;
        server 10.50.1.185:3000;
    }

    server {
        listen 80;
        server_name _;

        location = / {
            return 200 'Load Balancer OK\n';
            add_header Content-Type text/plain;
        }

        location /alumnos {
            proxy_pass http://backend_alumno_c;
    proxy_next_upstream error timeout http_502 http_503 http_504;  # ← añadir esto
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /profesores {
            proxy_pass http://backend_alumno_d;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /profesores {
            return 301 /profesores/;
        }

        location /practicas/ {
            proxy_pass http://backend_alumno_e/; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

       # location = /practicas {
       #     return 301 $scheme://$http_host/practicas/;
       # }

        location /status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
}