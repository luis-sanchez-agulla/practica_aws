AWSTemplateFormatVersion: '2010-09-09'
Description: Student B Load Balancer stack with its own Security Group using
  Bitnami NGINX AMI

Parameters:
  ProjectName:
    Type: String
    Default: practica-aws
    Description: Project identifier used in tags and names

  OwnerName:
    Type: String
    Default: alumnoB
    Description: Stack owner or student name

  AmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-0e7ece8c2e545b08e
    Description: Bitnami NGINX AMI for eu-south-2

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
      - t3.large
    Description: EC2 instance type for the load balancer

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 Key Pair name

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the load balancer will be deployed

  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet where the load balancer will be deployed

  AllowedSshCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to access the instance via SSH

  AllowedHttpCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to access HTTP

  AllowedHttpsCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to access HTTPS

Resources:
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for Student B load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSshCidr
          Description: SSH access
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedHttpCidr
          Description: HTTP access
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedHttpsCidr
          Description: HTTPS access
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Default outbound traffic
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${OwnerName}-lb-sg
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Layer
          Value: load-balancer

  LoadBalancerInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnetId
      SecurityGroupIds:
        - !Ref LoadBalancerSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${OwnerName}-lb
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Layer
          Value: load-balancer

  LoadBalancerElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${OwnerName}-lb-eip
        - Key: Project
          Value: !Ref ProjectName
        - Key: Owner
          Value: !Ref OwnerName
        - Key: Layer
          Value: load-balancer

  LoadBalancerElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref LoadBalancerInstance
      AllocationId: !GetAtt LoadBalancerElasticIp.AllocationId

Outputs:
  LoadBalancerInstanceId:
    Description: EC2 instance ID of the load balancer
    Value: !Ref LoadBalancerInstance

  LoadBalancerPrivateIp:
    Description: Private IP of the load balancer
    Value: !GetAtt LoadBalancerInstance.PrivateIp

  LoadBalancerElasticIp:
    Description: Elastic IP associated with the load balancer
    Value: !Ref LoadBalancerElasticIp

  LoadBalancerSecurityGroupId:
    Description: Security Group ID of the load balancer
    Value: !Ref LoadBalancerSecurityGroup

  LoadBalancerAmiId:
    Description: AMI used by the load balancer
    Value: !Ref AmiId