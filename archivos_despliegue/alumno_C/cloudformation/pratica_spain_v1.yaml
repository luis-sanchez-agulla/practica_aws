  EIPAssociation2:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref WebServer2
      EIP: !Ref EIPWebServer2

Outputs:

  WebServer1IP:
    Description: IP publica WebServer1
    Value: !Ref EIPWebServer1

  WebServer2IP:
    Description: IP publica WebServer2
    Value: !Ref EIPWebServer2

  WebServer1PrivateIP:
    Description: IP privada WebServer1 (para el Load Balancer)
    Value: !GetAtt WebServer1.PrivateIp

  WebServer2PrivateIP:
    Description: IP privada WebServer2 (para el Load Balancer)
    Value: !GetAtt WebServer2.PrivateIp

  HealthCheck1:
    Description: URL health check WebServer1
    Value: !Sub "http://${EIPWebServer1}/health"

  HealthCheck2:
    Description: URL health check WebServer2
    Value: !Sub "http://${EIPWebServer2}/health"