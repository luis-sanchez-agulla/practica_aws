                  cur.execute("SELECT id, nombre, correo FROM alumnos ORDER BY nombre")
                  rows=cur.fetchall(); cur.close(); conn.close()
                  return jsonify([{"id":r[0],"nombre":r[1],"correo":r[2]} for r in rows])
              except Exception as e:
                  return jsonify({"error":str(e)}),500

          @app.route('/alumnos/<int:alumno_id>/notas', methods=['GET'])
          def get_notas(alumno_id):
              try:
                  conn=get_db(); cur=conn.cursor()
                  cur.execute("SELECT i.id,i.asignatura_id,i.nota FROM inscripciones i WHERE i.alumno_id=%s",(alumno_id,))
                  rows=cur.fetchall(); cur.close(); conn.close()
                  return jsonify([{"id":r[0],"asignatura_id":r[1],"nota":r[2]} for r in rows])
              except Exception as e:
                  return jsonify({"error":str(e)}),500

          @app.route('/alumnos/<int:alumno_id>/inscripciones', methods=['POST'])
          def inscribir(alumno_id):
