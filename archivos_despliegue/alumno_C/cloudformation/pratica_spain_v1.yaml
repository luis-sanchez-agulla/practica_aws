AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Alumno C (Daniel Minguito) - 2 Web Servers Linux modulo /alumnos
  Amazon Linux 2023, t3.micro, eu-south-2
  Nginx + Flask + NTP con AD + BD Alumno B

Parameters:

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: keypair_alumnoC

  ADIP:
    Type: String
    Default: "10.10.1.10"
    Description: IP del Active Directory para NTP

  DBIP:
    Type: String
    Default: "10.20.2.45"
    Description: IP privada del servidor PostgreSQL (Alumno B)

  DBName:
    Type: String
    Default: "universidad"

  DBUser:
    Type: String
    Default: "app_user"

  DBPass:
    Type: String
    Default: "app_password"
    NoEcho: true

  LBIP:
    Type: String
    Default: "10.20.1.153"
    Description: IP privada del Load Balancer (Alumno B)

Resources:

  # -------------------------------------------------------
  # ROL IAM
  # -------------------------------------------------------
  RolEC2S3AlumnoC:
    Type: AWS::IAM::Role
    Properties:
      RoleName: rol-ec2-s3-minguito
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

  InstanceProfileAlumnoC:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: perfil-ec2-s3-minguito
      Roles:
        - !Ref RolEC2S3AlumnoC

  # -------------------------------------------------------
  # Security Group
  # Solo acepta trafico HTTP desde el Load Balancer (10.20.1.153)
  # -------------------------------------------------------
  SGWebServerC:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SG Web Servers Alumno C
      VpcId: vpc-088606d90ab567b3d
      SecurityGroupIngress:
        # SSH para administracion
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        # HTTP solo desde el Load Balancer
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Sub "${LBIP}/32"
        # Flask solo desde la VPC interna
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          CidrIp: 10.20.0.0/16
        # NTP
        - IpProtocol: udp
          FromPort: 123
          ToPort: 123
          CidrIp: 0.0.0.0/0
        # Todo el trafico interno del equipo
        - IpProtocol: -1
          CidrIp: 10.0.0.0/8
      Tags:
        - Key: Name
          Value: SG-WebServer-AlumnoC

  # -------------------------------------------------------
  # Elastic IPs
  # -------------------------------------------------------
  EIPWebServer1:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  EIPWebServer2:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  # -------------------------------------------------------
  # Web Server 1
  # -------------------------------------------------------
  WebServer1:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-048dc219ff68b99b1
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref InstanceProfileAlumnoC
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeviceIndex: '0'
          SubnetId: subnet-0589467c73b0f7497
          GroupSet:
            - !Ref SGWebServerC
      Tags:
        - Key: Name
          Value: WebServer1-AlumnoC
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          exec > /var/log/userdata.log 2>&1

          dnf update -y
          dnf install -y nginx python3 python3-pip chrony postgresql15

          # NTP con el AD
          cat > /etc/chrony.conf << 'CHRONY'
          server ${ADIP} iburst prefer
          server 0.pool.ntp.org iburst
          driftfile /var/lib/chrony/drift
          makestep 1.0 3
          rtcsync
          CHRONY
          systemctl enable --now chronyd
          chronyc makestep || true

          # Flask
          pip3 install flask psycopg2-binary flask-cors

          mkdir -p /opt/app
          cat > /opt/app/app.py << 'PYAPP'
          from flask import Flask, jsonify, request
          from flask_cors import CORS
          import psycopg2, os

          app = Flask(__name__)
          CORS(app)

          def get_db():
              return psycopg2.connect(
                  host=os.environ.get('DB_HOST','${DBIP}'),
                  database=os.environ.get('DB_NAME','${DBName}'),
                  user=os.environ.get('DB_USER','${DBUser}'),
                  password=os.environ.get('DB_PASS','${DBPass}'),
                  port=5432
              )

          @app.route('/alumnos', methods=['GET'])
          def get_alumnos():
              try:
                  conn=get_db(); cur=conn.cursor()
                  cur.execute("SELECT id, nombre, correo FROM alumnos ORDER BY nombre")
                  rows=cur.fetchall(); cur.close(); conn.close()
                  return jsonify([{"id":r[0],"nombre":r[1],"correo":r[2]} for r in rows])
              except Exception as e:
                  return jsonify({"error":str(e)}),500

          @app.route('/alumnos/<int:alumno_id>/notas', methods=['GET'])
          def get_notas(alumno_id):
              try:
                  conn=get_db(); cur=conn.cursor()
                  cur.execute("SELECT i.id,i.asignatura_id,i.nota FROM inscripciones i WHERE i.alumno_id=%s",(alumno_id,))
                  rows=cur.fetchall(); cur.close(); conn.close()
                  return jsonify([{"id":r[0],"asignatura_id":r[1],"nota":r[2]} for r in rows])
              except Exception as e:
                  return jsonify({"error":str(e)}),500

          @app.route('/alumnos/<int:alumno_id>/inscripciones', methods=['POST'])
          def inscribir(alumno_id):
              data=request.get_json()
              try:
                  conn=get_db(); cur=conn.cursor()
                  cur.execute("INSERT INTO inscripciones (alumno_id,asignatura_id) VALUES (%s,%s) RETURNING id",(alumno_id,data['asignatura_id']))
                  new_id=cur.fetchone()[0]; conn.commit(); cur.close(); conn.close()
                  return jsonify({"id":new_id,"mensaje":"Inscripcion realizada"}),201
              except Exception as e:
                  return jsonify({"error":str(e)}),500

          @app.route('/health')
          def health():
              return jsonify({"status":"ok","servidor":"WebServer1-AlumnoC"})

          if __name__=='__main__':
              app.run(host='0.0.0.0',port=5000)
          PYAPP

          cat > /etc/systemd/system/flask-app.service << 'SERVICE'
          [Unit]
          Description=Flask App AlumnoC
          After=network.target
          [Service]
          User=root
          WorkingDirectory=/opt/app
          Environment="DB_HOST=${DBIP}"
          Environment="DB_NAME=${DBName}"
          Environment="DB_USER=${DBUser}"
          Environment="DB_PASS=${DBPass}"
          ExecStart=/usr/bin/python3 /opt/app/app.py
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          SERVICE

          systemctl enable --now flask-app

          # Nginx
          cat > /etc/nginx/conf.d/alumnos.conf << 'NGINX'
          server {
              listen 80;
              server_name _;
              location /alumnos {
                  proxy_pass http://127.0.0.1:5000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }
              location /health {
                  proxy_pass http://127.0.0.1:5000;
              }
          }
          NGINX

          rm -f /etc/nginx/conf.d/default.conf
          sed -i 's/listen       80;/#listen       80;/g' /etc/nginx/nginx.conf
          sed -i 's/listen       \[::\]:80;/#listen       [::]:80;/g' /etc/nginx/nginx.conf
          systemctl enable --now nginx
          systemctl restart nginx

          echo "WebServer1-AlumnoC OK" > /tmp/setup_done.txt

  EIPAssociation1:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref WebServer1
      EIP: !Ref EIPWebServer1

  # -------------------------------------------------------
  # Web Server 2
  # -------------------------------------------------------
  WebServer2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-048dc219ff68b99b1
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref InstanceProfileAlumnoC
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeviceIndex: '0'
          SubnetId: subnet-0589467c73b0f7497
          GroupSet:
            - !Ref SGWebServerC
      Tags:
        - Key: Name
          Value: WebServer2-AlumnoC
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          exec > /var/log/userdata.log 2>&1

          dnf update -y
          dnf install -y nginx python3 python3-pip chrony postgresql15

          cat > /etc/chrony.conf << 'CHRONY'
          server ${ADIP} iburst prefer
