        - AssociatePublicIpAddress: false
          DeviceIndex: '0'
          SubnetId: subnet-0589467c73b0f7497
          GroupSet:
            - !Ref SGWebServerC
      Tags:
        - Key: Name
          Value: WebServer2-AlumnoC
