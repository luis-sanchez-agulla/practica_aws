          @app.route('/health')
          def health():
              return jsonify({"status":"ok","servidor":"WebServer2-AlumnoC"})

          if __name__=='__main__':
              app.run(host='0.0.0.0',port=5000)
          PYAPP

          cat > /etc/systemd/system/flask-app.service << 'SERVICE'
          [Unit]
          Description=Flask App AlumnoC WS2
          After=network.target
          [Service]
          User=root
          WorkingDirectory=/opt/app
          Environment="DB_HOST=${DBIP}"
          Environment="DB_NAME=${DBName}"
          Environment="DB_USER=${DBUser}"
          Environment="DB_PASS=${DBPass}"
          ExecStart=/usr/bin/python3 /opt/app/app.py
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          SERVICE

          systemctl enable --now flask-app

          cat > /etc/nginx/conf.d/alumnos.conf << 'NGINX'
          server {
              listen 80;
              server_name _;
              location /alumnos {
                  proxy_pass http://127.0.0.1:5000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }
              location /health {
                  proxy_pass http://127.0.0.1:5000;
              }
          }
          NGINX

          rm -f /etc/nginx/conf.d/default.conf
          sed -i 's/listen       80;/#listen       80;/g' /etc/nginx/nginx.conf
          sed -i 's/listen       \[::\]:80;/#listen       [::]:80;/g' /etc/nginx/nginx.conf
          systemctl enable --now nginx
          systemctl restart nginx

          echo "WebServer2-AlumnoC OK" > /tmp/setup_done.txt

  EIPAssociation2:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref WebServer2
      EIP: !Ref EIPWebServer2

Outputs:

  WebServer1IP:
    Description: IP publica WebServer1 (dar al Load Balancer)
    Value: !Ref EIPWebServer1

  WebServer2IP:
    Description: IP publica WebServer2 (dar al Load Balancer)
    Value: !Ref EIPWebServer2

  WebServer1PrivateIP:
    Description: IP privada WebServer1
    Value: !GetAtt WebServer1.PrivateIp

  WebServer2PrivateIP:
    Description: IP privada WebServer2
    Value: !GetAtt WebServer2.PrivateIp

  HealthCheck1:
    Description: URL health check WebServer1
    Value: !Sub "http://${EIPWebServer1}/health"

  HealthCheck2:
    Description: URL health check WebServer2
    Value: !Sub "http://${EIPWebServer2}/health"

  RolIAM:
    Description: ARN del rol IAM para acceso S3 cross-account
    Value: !GetAtt RolEC2S3AlumnoC.Arn