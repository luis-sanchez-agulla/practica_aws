<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Módulo Alumnos</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #333; border-bottom: 2px solid #4A90D9; padding-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    th { background: #4A90D9; color: white; padding: 10px; }
    td { padding: 8px; border-bottom: 1px solid #ddd; }
    tr:hover { background: #f5f5f5; }
    .formulario { background: #f9f9f9; border: 1px solid #ddd; padding: 20px; border-radius: 6px; margin: 20px 0; }
    .formulario h2 { color: #4A90D9; margin-top: 0; }
    .formulario input { padding: 8px; margin: 5px 0 10px 0; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .formulario button { background: #4A90D9; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
    .formulario button:hover { background: #357ABD; }
    .mensaje { padding: 10px; border-radius: 4px; margin: 10px 0; display: none; }
    .ok { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h1>Módulo de Alumnos</h1>

  <div class="formulario">
    <h2>Añadir nuevo alumno</h2>
    <label>Nombre:</label>
    <input type="text" id="nombre" placeholder="Nombre completo">
    <label>Correo:</label>
    <input type="email" id="correo" placeholder="correo@ufv.es">
    <button onclick="crearAlumno()">Crear alumno</button>
    <div id="mensaje" class="mensaje"></div>
  </div>

  <table id="tabla">
    <thead><tr><th>ID</th><th>Nombre</th><th>Correo</th></tr></thead>
    <tbody></tbody>
  </table>

  <script>
    function cargarAlumnos() {
      fetch('/alumnos')
        .then(r => r.json())
        .then(data => {
          document.querySelector('#tabla tbody').innerHTML = data.map(a =>
            '<tr><td>' + a.id + '</td><td>' + a.nombre + '</td><td>' + a.correo + '</td></tr>'
          ).join('');
        });
    }

    function crearAlumno() {
      const nombre = document.getElementById('nombre').value.trim();
      const correo = document.getElementById('correo').value.trim();
      const msg = document.getElementById('mensaje');

      if (!nombre || !correo) {
        msg.textContent = 'Rellena nombre y correo.';
        msg.className = 'mensaje error';
        msg.style.display = 'block';
        return;
      }

      fetch('/alumnos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, correo })
      })
      .then(r => r.json())
      .then(data => {
        if (data.id) {
          msg.textContent = 'Alumno creado correctamente con ID ' + data.id;
          msg.className = 'mensaje ok';
          document.getElementById('nombre').value = '';
          document.getElementById('correo').value = '';
          cargarAlumnos();
        } else {
          msg.textContent = 'Error: ' + data.error;
          msg.className = 'mensaje error';
        }
        msg.style.display = 'block';
      });
    }

    cargarAlumnos();
  </script>
</body>
</html>
